[env:full]
platform = espressif32
board = lolin_c3_mini
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps = h2zero/NimBLE-Arduino@^2.3.7, bblanchon/ArduinoJson@ ^7.4.2
build_flags =
  ; ============================================================
  ; Illustrative flags (uncomment as needed)
  ; ============================================================
  ; --- Core feature toggles ---
  -DWEBUI_ENABLE=1          ; Web UI + HTTP API (auto-enables WiFi)
  -DNMEA_ENABLE=1           ; NMEA parsing for UI (requires WEBUI, otherwise build warning and no NMEA parsing)
  -DBLE_ENABLE=1            ; BLE NUS bridge
  -DTCP_ENABLE=1            ; Single-client TCP bridge (auto-enables WiFi)
  -DNTRIP_CLIENT_ENABLE=1   ; NTRIP client (auto-enables WiFi)
  ; --- TCP ---
  -DTCP_PORT=52148          ; TCP listening port (default is 5000 otherwise set in app.h)
  ; --- WiFi mode selection ---
  ; WiFi is auto-enabled when WEBUI, TCP or NTRIP is set. Can be enabled standalone for WiFi config/testing via -DWIFI_ENABLE=1
  -DWIFI_DUAL_MODE=1        ; STA + softAP (default: STA only)
  ;-DSTA_CHANNEL=11          ; Fixed STA channel (1-13, 0=auto)
  ;-DSOFTAP_CHANNEL=1        ; Use a different channel than STA_CHANNEL
  ;-DSOFTAP_SSID_VALUE="GNSS-ESP32-AP"
  ;-DSOFTAP_PASS_VALUE=""   ; Empty = open AP
  ; --- Lock production WiFi config ---
  ;-DFORCE_WIFI_SECRETS=1    ; Force WiFi credentials from include/secrets.h
  ; Note: when enabled, runtime/LittleFS WiFi config is ignored.
  ; --- Lock production UART config ---
  ;-DFORCE_HARDCODED_UART=1
  ;-DHARD_RX_PIN=20
  ;-DHARD_TX_PIN=21
  ;-DHARD_BAUD=115200
  ; Note: when enabled, runtime GNSS UART config is ignored.
  ; --- BLE examples ---
  -DBLE_DEVICE_NAME=\"MyGNSS\" ; Advertised BLE device name
  ;-DBLE_MTU_CFG=185            ; ATT MTU (default in app.h is 23)
  ; --- NTRIP behavior examples ---
  ;-DNTRIP_CLIENT_ENABLE_TASK=0           ; Disable dedicated NTRIP task
  ;-DNTRIP_CLIENT_ENABLE_REV1_FALLBACK=0  ; Disable NTRIP Rev1 fallback
