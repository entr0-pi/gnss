[env]
platform = espressif32
board = lolin_c3_mini
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts =
  pre:scripts/gzip_web.py
lib_deps = h2zero/NimBLE-Arduino@^2.3.7, bblanchon/ArduinoJson@ ^7.4.2
build_flags =
  -DBLE_DEVICE_NAME=\"MyGNSS\"
  ;-DFORCE_HARDCODED_UART=1
  ;-DHARD_RX_PIN=20
  ;-DHARD_TX_PIN=21
  ;-DHARD_BAUD=115200
  ; Uncomment to force hardcoded UART pins (bypasses LittleFS config)
  ; Useful for production builds with known hardware configuration

[env:full]
build_flags =
  ${env.build_flags}
  -DWEBUI_ENABLE=1
  -DNMEA_ENABLE=1
  -DTCP_ENABLE=1
  -DTCP_PORT=52148
