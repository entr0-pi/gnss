[env]
platform = espressif32
board = lolin_c3_mini
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
extra_scripts = 
  pre:scripts/gzip_web.py 
lib_deps = h2zero/NimBLE-Arduino@^2.3.7, bblanchon/ArduinoJson@ ^7.4.2
build_flags =
  -DBLE_DEVICE_NAME=\"MyGNSS\"

[env:full]
build_flags =
  ${env.build_flags}
  -DWEBUI_ENABLE=1
  -DNMEA_ENABLE=1
  -DTCP_ENABLE=1
  -DTCP_PORT=52148
