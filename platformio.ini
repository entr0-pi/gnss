[env:full]
platform = espressif32
board = lolin_c3_mini
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps = h2zero/NimBLE-Arduino@^2.3.7, bblanchon/ArduinoJson@ ^7.4.2
build_flags =
  -DGLOBAL_LOG_LEVEL=4
  -DWEBUI_ENABLE=1
  -DNMEA_ENABLE=1
  -DTCP_ENABLE=1
  -DTCP_PORT=52148
  -DNTRIP_CLIENT_ENABLE=1
  ;-DBLE_ENABLE=1
  ;-DBLE_DEVICE_NAME=\"MyGNSS\"
  ; WiFi mode selection
  ;-DWIFI_DUAL_MODE=1        ; STA + softAP (default: STA only)
  ;-DSTA_CHANNEL=11          ; Fixed STA channel (1-13, 0=auto)
  ;-DSOFTAP_CHANNEL=1        ; Use a different channel than STA_CHANNEL
  ;-DSOFTAP_SSID_VALUE="GNSS-ESP32-AP"
  ;-DSOFTAP_PASS_VALUE=""   ; Empty = open AP
  ; *****
  ;-DFORCE_WIFI_SECRETS=1
  ; Uncomment to force WiFi credentials from include/secrets.h (skip LittleFS wifi.json)
  ; Useful for production builds with known hardware configuration
  ; *****
  ;-DFORCE_HARDCODED_UART=1
  ;-DHARD_RX_PIN=20
  ;-DHARD_TX_PIN=21
  ;-DHARD_BAUD=115200
  ; Uncomment to force hardcoded UART pins (bypasses LittleFS config)
  ; Useful for production builds with known hardware configuration